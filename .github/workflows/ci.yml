name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution-scripts:
    name: Distribution — source install contract
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install ShellCheck
        run: brew install shellcheck
      - name: Check shell and Python scripts
        run: |
          bash -n install.sh scripts/update.sh scripts/uninstall.sh bin/perch scripts/lib/perch-common.sh
          shellcheck install.sh scripts/update.sh scripts/uninstall.sh bin/perch scripts/lib/perch-common.sh
          python3 -m py_compile scripts/verify-local-health.py
      - name: Verify pinned Node runtime manifest
        run: |
          set -euo pipefail
          source release/node-runtime.env
          archive="node-v${NODE_VERSION}-${NODE_PLATFORM}.${NODE_ARCHIVE_FORMAT}"
          expected="$(awk -v name="$archive" '$2 == name {print $1}' release/node-runtime.sha256)"
          test "${#expected}" -eq 64
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            "${NODE_BASE_URL}/v${NODE_VERSION}/SHASUMS256.txt" \
            --output "$RUNNER_TEMP/SHASUMS256.txt"
          grep -F "${expected}  ${archive}" "$RUNNER_TEMP/SHASUMS256.txt"
      - name: Require local daemon and app compatibility resources
        run: |
          test -f backend/src/index.ts || {
            echo "ERROR: backend/src/index.ts is required for source distribution."; exit 1;
          }
          test -f app/scripts/daemon-entry.mjs || {
            echo "ERROR: app/scripts/daemon-entry.mjs is required for source distribution."; exit 1;
          }
          test -f app/Resources/engineering.super.Perch.daemon.plist.template
          plutil -lint app/Resources/engineering.super.Perch.daemon.plist.template

  backend-lint:
    name: Backend — type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - name: Type-check (tsc --noEmit)
        working-directory: backend
        run: npx tsc --noEmit

  backend-test:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - name: Unit tests
        working-directory: backend
        run: npm test && npm run test:db
      - name: Runtime-policy gate (no child-process permission)
        working-directory: backend
        run: npm run test:runtime-policy
      - name: Dependency audit
        working-directory: backend
        run: npm audit --audit-level=low

  site-build:
    name: Site — lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - working-directory: site
        run: npm ci
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Build
        working-directory: site
        run: npm run build
      - name: Dependency audit
        working-directory: site
        run: npm audit --audit-level=low
      - name: Upload built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: site/dist
          retention-days: 1

  site-accessibility:
    name: Site — accessibility (axe/WCAG 2.2 AA)
    runs-on: ubuntu-latest
    needs: site-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - working-directory: site
        run: npm ci
      - name: Download built site
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: site-dist
          path: site/dist
      - name: Install Playwright browsers
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Run accessibility tests
        working-directory: site
        run: npm run test:a11y

  swift-build:
    name: Swift — test + build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Swift and macOS SDK
        run: swift --version && xcrun --sdk macosx --show-sdk-version
      - working-directory: app
        run: swift package resolve
      - name: Lockfile integrity
        working-directory: app
        run: git diff --exit-code -- Package.resolved
      - name: Swift test
        working-directory: app
        run: swift test
      - name: Swift build
        working-directory: app
        run: swift build
      - name: Direct-distribution static verification
        run: python3 app/scripts/verify_release_static.py
      - name: Generate Xcode project and resolve release dependencies
        working-directory: app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project Perch.xcodeproj -scheme Perch
          xcodebuild -project Perch.xcodeproj -scheme Perch -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/perch-ci" \
            CODE_SIGNING_ALLOWED=NO build

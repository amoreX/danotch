name: Release macOS

# Triggered manually or when a version tag is pushed (e.g. v1.2.3).
# Protected environment "release" gates access to signing and publication
# secrets. Pull-request and ad-hoc builds NEVER have access to these secrets
# and MUST NOT produce distributable artifacts.
#
# CREDENTIAL REQUIREMENTS (all stored in the "release" environment):
#   DEVELOPER_ID_CERT_P12       – base64-encoded Developer ID Application .p12 export
#   DEVELOPER_ID_CERT_PASSWORD  – passphrase for the .p12 archive
#   APPLE_ID                    – Apple ID email used for notarytool
#   APPLE_ID_PASSWORD           – app-specific password for the Apple ID
#   APPLE_TEAM_ID               – 10-character Apple Developer Team ID
#   VERCEL_BLOB_TOKEN           – Vercel Blob API token (store:rw scope)
#   PERCH_API_BASE_URL           – release environment variable with the HTTPS API origin
#   PERCH_DEVICE_GATEWAY_URL     – release environment variable with the WSS gateway URL
#
# None of these can be substituted with ad-hoc or development credentials.
# The workflow refuses to produce distributable artifacts if any are absent.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.2.3)'
        required: true

permissions:
  contents: read
  id-token: write   # required for gh attestation / OIDC provenance
  attestations: write

jobs:
  release:
    name: Sign, notarize, attest, and publish
    runs-on: macos-26
    environment: release
    env:
      PERCH_API_BASE_URL: ${{ vars.PERCH_API_BASE_URL }}
      PERCH_DEVICE_GATEWAY_URL: ${{ vars.PERCH_DEVICE_GATEWAY_URL }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Fail fast if any required credential secret is absent.
      - name: Verify release credentials are present
        shell: bash
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERCEL_BLOB_TOKEN: ${{ secrets.VERCEL_BLOB_TOKEN }}
        run: |
          missing=()
          [[ -z "$DEVELOPER_ID_CERT_P12" ]]      && missing+=(DEVELOPER_ID_CERT_P12)
          [[ -z "$DEVELOPER_ID_CERT_PASSWORD" ]]  && missing+=(DEVELOPER_ID_CERT_PASSWORD)
          [[ -z "$APPLE_ID" ]]                    && missing+=(APPLE_ID)
          [[ -z "$APPLE_ID_PASSWORD" ]]           && missing+=(APPLE_ID_PASSWORD)
          [[ -z "$APPLE_TEAM_ID" ]]               && missing+=(APPLE_TEAM_ID)
          [[ -z "$VERCEL_BLOB_TOKEN" ]]            && missing+=(VERCEL_BLOB_TOKEN)
          [[ -z "$PERCH_API_BASE_URL" ]]            && missing+=(PERCH_API_BASE_URL)
          [[ -z "$PERCH_DEVICE_GATEWAY_URL" ]]      && missing+=(PERCH_DEVICE_GATEWAY_URL)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Missing required release secrets or variables: ${missing[*]}"
            echo "Ad-hoc, unnotarized, or unconfigured artifacts are REFUSED."
            exit 1
          fi
          [[ "$PERCH_API_BASE_URL" =~ ^https:// ]] || {
            echo "ERROR: PERCH_API_BASE_URL must be an HTTPS URL."
            exit 1
          }
          [[ "$PERCH_DEVICE_GATEWAY_URL" =~ ^wss:// ]] || {
            echo "ERROR: PERCH_DEVICE_GATEWAY_URL must be a WSS URL."
            exit 1
          }
          [[ "$PERCH_API_BASE_URL" != *".example"* ]] || {
            echo "ERROR: PERCH_API_BASE_URL cannot use a reserved example domain."
            exit 1
          }
          [[ "$PERCH_DEVICE_GATEWAY_URL" != *".example"* ]] || {
            echo "ERROR: PERCH_DEVICE_GATEWAY_URL cannot use a reserved example domain."
            exit 1
          }
          echo "All required release credentials are present."

      # Import the Developer ID certificate into a temporary per-job Keychain
      # that is deleted unconditionally in the cleanup step. The Keychain is
      # locked immediately after import so the cert is only accessible to
      # codesign via the per-process unlock token.
      - name: Import Developer ID certificate into temporary Keychain
        shell: bash
        env:
          CERT_P12_B64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          echo "$CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')

          # Verify the identity is present before proceeding
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [[ -z "$IDENTITY" ]]; then
            echo "ERROR: Developer ID Application identity not found in imported certificate."
            exit 1
          fi
          echo "Developer ID identity: $IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # Build the app bundle. The Xcode build intentionally does NOT pass
      # CODE_SIGNING_ALLOWED=NO — signing happens in the next steps.
      - name: Build Perch.app
        shell: bash
        run: |
          cd app
          xcodegen generate
          DERIVED_DATA="$RUNNER_TEMP/xcode-release"
          xcodebuild \
            -project Perch.xcodeproj \
            -scheme Perch \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            PERCH_API_BASE_URL="$PERCH_API_BASE_URL" \
            PERCH_DEVICE_GATEWAY_URL="$PERCH_DEVICE_GATEWAY_URL" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo "BUILT_APP=$DERIVED_DATA/Build/Products/Release/Perch.app" >> "$GITHUB_ENV"

      # Sign inside-out: nested binaries, helpers, and frameworks first,
      # then the outer .app. Every binary gets --options runtime (Hardened
      # Runtime). The executor helper (if present) uses its own entitlements.
      - name: Codesign inside-out with Hardened Runtime
        shell: bash
        run: |
          APP="$BUILT_APP"
          ENTITLEMENTS="$GITHUB_WORKSPACE/app/Perch.entitlements"
          EXEC_ENTITLEMENTS="$GITHUB_WORKSPACE/app/Executor.entitlements"

          codesign_with_runtime() {
            local path="$1"
            local ents="$2"
            codesign --force --options runtime \
              --entitlements "$ents" \
              --sign "$SIGNING_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              "$path"
          }

          # Sign nested frameworks
          find "$APP/Contents/Frameworks" -name "*.framework" -o -name "*.dylib" 2>/dev/null | while read -r item; do
            codesign_with_runtime "$item" "$ENTITLEMENTS"
          done

          # Sign executor helper with its own entitlements if present
          EXEC="$APP/Contents/Helpers/PerchExecutor"
          if [[ -f "$EXEC" ]]; then
            codesign_with_runtime "$EXEC" "$EXEC_ENTITLEMENTS"
          fi

          # Sign the outer app bundle
          codesign_with_runtime "$APP" "$ENTITLEMENTS"

          echo "Codesign complete."

      # Verify signature before submitting for notarization.
      - name: Verify codesign
        shell: bash
        run: |
          codesign --verify --deep --strict "$BUILT_APP"
          codesign -dvvv "$BUILT_APP"
          spctl --assess --type execute -vv "$BUILT_APP" || true  # spctl requires notarization — runs again post-staple

      # Create a zip archive for notarytool submission (Apple requires zip or dmg).
      - name: Create archive for notarization
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA:0:8}}"
          ARCHIVE="$RUNNER_TEMP/Perch-${VERSION}.zip"
          ditto -c -k --keepParent "$BUILT_APP" "$ARCHIVE"
          echo "NOTARIZE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Submit to Apple notary service. notarytool waits for the result.
      # Failure here aborts the release — unnotarized artifacts are refused.
      - name: Notarize with notarytool
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$NOTARIZE_ARCHIVE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json \
            | tee "$RUNNER_TEMP/notarytool-result.json"

          STATUS=$(python3 -c "import json,sys; d=json.load(open('$RUNNER_TEMP/notarytool-result.json')); print(d.get('status',''))")
          if [[ "$STATUS" != "Accepted" ]]; then
            echo "ERROR: Notarization failed with status: $STATUS"
            cat "$RUNNER_TEMP/notarytool-result.json"
            exit 1
          fi
          echo "Notarization accepted."

      # Staple the notarization ticket into the .app bundle so Gatekeeper can
      # verify offline. This modifies the bundle in place.
      - name: Staple notarization ticket
        shell: bash
        run: |
          xcrun stapler staple "$BUILT_APP"
          xcrun stapler validate "$BUILT_APP"

      # Post-staple Gatekeeper + codesign deep verification.
      - name: Verify Gatekeeper acceptance
        shell: bash
        run: |
          spctl --assess --type execute -vv "$BUILT_APP"
          codesign --verify --deep --strict "$BUILT_APP"
          codesign -dvvv "$BUILT_APP"

      # Scan the archive for embedded credentials or debug material before
      # publishing. The release aborts if trufflehog reports verified findings.
      - name: Credential scan on release archive
        shell: bash
        run: |
          brew install trufflehog
          command -v trufflehog >/dev/null
          # Scan the app bundle directory (not the zip, to avoid binary false-positives in compressed data)
          trufflehog filesystem "$BUILT_APP" --only-verified --fail

      # Repackage the stapled .app into the final distribution archive.
      - name: Repackage stapled archive
        shell: bash
        run: |
          FINAL_ARCHIVE="$RUNNER_TEMP/Perch-${RELEASE_VERSION}-signed.zip"
          ditto -c -k --keepParent "$BUILT_APP" "$FINAL_ARCHIVE"
          echo "FINAL_ARCHIVE=$FINAL_ARCHIVE" >> "$GITHUB_ENV"

      # Generate sha256 checksum for integrity verification.
      - name: Compute SHA-256 checksum
        shell: bash
        run: |
          CHECKSUM=$(shasum -a 256 "$FINAL_ARCHIVE" | awk '{print $1}')
          echo "ARTIFACT_SHA256=$CHECKSUM" >> "$GITHUB_ENV"
          echo "$CHECKSUM  Perch-${RELEASE_VERSION}-signed.zip" > "$RUNNER_TEMP/Perch-${RELEASE_VERSION}.sha256"
          echo "Artifact SHA-256: $CHECKSUM"

      # Upload to Vercel Blob as a content-addressed immutable object.
      # The URL is derived from the checksum to ensure each artifact is unique
      # and rollback is a manifest pointer swap, not a file overwrite.
      - name: Upload artifact to Vercel Blob
        shell: bash
        env:
          VERCEL_BLOB_TOKEN: ${{ secrets.VERCEL_BLOB_TOKEN }}
        run: |
          BLOB_PATH="releases/${RELEASE_VERSION}/Perch-${RELEASE_VERSION}-signed.zip"
          CHECKSUM_PATH="releases/${RELEASE_VERSION}/Perch-${RELEASE_VERSION}.sha256"

          upload_to_blob() {
            local local_path="$1"
            local blob_key="$2"
            curl -s -f -X PUT \
              "https://blob.vercel-storage.com/${blob_key}" \
              -H "Authorization: Bearer $VERCEL_BLOB_TOKEN" \
              -H "x-content-type: application/octet-stream" \
              -H "x-cache-control-max-age: 31536000" \
              --data-binary "@${local_path}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['url'])"
          }

          ARTIFACT_URL=$(upload_to_blob "$FINAL_ARCHIVE" "$BLOB_PATH")
          CHECKSUM_URL=$(upload_to_blob "$RUNNER_TEMP/Perch-${RELEASE_VERSION}.sha256" "$CHECKSUM_PATH")

          echo "ARTIFACT_URL=$ARTIFACT_URL" >> "$GITHUB_ENV"
          echo "CHECKSUM_URL=$CHECKSUM_URL" >> "$GITHUB_ENV"
          echo "Artifact URL: $ARTIFACT_URL"
          echo "Checksum URL: $CHECKSUM_URL"

      # GitHub artifact attestation — links the artifact digest to this workflow
      # run for supply-chain provenance. Requires id-token: write permission.
      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ env.FINAL_ARCHIVE }}

      # Upload release assets to the workflow run for auditors.
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perch-release-${{ env.RELEASE_VERSION }}
          path: |
            ${{ env.FINAL_ARCHIVE }}
            ${{ runner.temp }}/Perch-${{ env.RELEASE_VERSION }}.sha256
            ${{ runner.temp }}/notarytool-result.json
          retention-days: 90

      # Emit a structured summary for release operators.
      - name: Release summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Perch ${RELEASE_VERSION} — Release Summary

          | Field | Value |
          |-------|-------|
          | Version | ${RELEASE_VERSION} |
          | SHA-256 | \`${ARTIFACT_SHA256}\` |
          | Artifact URL | ${ARTIFACT_URL} |
          | Checksum URL | ${CHECKSUM_URL} |
          | Notarization | Accepted (Apple notary service) |
          | Gatekeeper | spctl --assess passed |
          | Signing | Developer ID Application (Hardened Runtime) |

          EOF

      # Unconditional Keychain cleanup — runs even if earlier steps fail.
      - name: Delete temporary Keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Temporary Keychain deleted."

name: Release macOS

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (vX.Y.Z)
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  release:
    name: Verify, sign, notarize, and publish
    runs-on: macos-26
    environment: Production
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PERCH_API_BASE_URL: ${{ vars.PERCH_API_BASE_URL }}
      PERCH_DEVICE_GATEWAY_URL: ${{ vars.PERCH_DEVICE_GATEWAY_URL }}
      PERCH_SPARKLE_FEED_URL: ${{ vars.PERCH_SPARKLE_FEED_URL }}
      PERCH_SPARKLE_PUBLIC_KEY: ${{ vars.PERCH_SPARKLE_PUBLIC_KEY }}
      PERCH_DOWNLOAD_MANIFEST_URL: ${{ vars.PERCH_DOWNLOAD_MANIFEST_URL }}

    steps:
      - name: Check out the requested tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag, main ancestry, and derive versions
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
            echo "ERROR: release tag must match vX.Y.Z exactly."; exit 1;
          }
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          [[ "$(git rev-parse HEAD)" == "$TAG_COMMIT" ]] || {
            echo "ERROR: workflow_dispatch did not check out the requested tag commit."; exit 1;
          }
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main || {
            echo "ERROR: $RELEASE_TAG does not point to a commit contained in main."; exit 1;
          }
          MARKETING_VERSION="${RELEASE_TAG#v}"
          BUILD_NUMBER="$(git rev-list --count "$TAG_COMMIT")"
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "ERROR: could not derive a positive monotonic build number."; exit 1;
          }
          {
            echo "TAG_COMMIT=$TAG_COMMIT"
            echo "MARKETING_VERSION=$MARKETING_VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
          } >> "$GITHUB_ENV"

      - name: Require successful main CI for release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in ci.yml security-baseline.yml; do
            conclusion="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${TAG_COMMIT}&status=completed&per_page=20" \
              --jq '.workflow_runs | map(select(.event == "push" and .head_branch == "main")) | sort_by(.created_at) | last | .conclusion // ""')"
            [[ "$conclusion" == "success" ]] || {
              echo "ERROR: ${workflow} has no successful main push run for ${TAG_COMMIT} (found '${conclusion:-none}')."
              exit 1
            }
          done

      - name: Verify protected release configuration
        shell: bash
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.VERCEL_BLOB_TOKEN }}
          EXECUTOR_KEY: ${{ secrets.EXECUTOR_ARTIFACT_SIGNING_KEY_PEM_B64 }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in DEVELOPER_ID_CERT_P12 DEVELOPER_ID_CERT_PASSWORD APPLE_ID \
            APPLE_ID_PASSWORD APPLE_TEAM_ID BLOB_READ_WRITE_TOKEN EXECUTOR_KEY \
            SPARKLE_KEY PERCH_API_BASE_URL PERCH_DEVICE_GATEWAY_URL \
            PERCH_SPARKLE_FEED_URL PERCH_SPARKLE_PUBLIC_KEY \
            PERCH_DOWNLOAD_MANIFEST_URL; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          ((${#missing[@]} == 0)) || {
            echo "ERROR: missing protected release secrets/variables: ${missing[*]}"; exit 1;
          }
          [[ "$PERCH_API_BASE_URL" =~ ^https://[^[:space:]]+$ ]]
          [[ "$PERCH_DEVICE_GATEWAY_URL" =~ ^wss://[^[:space:]]+$ ]]
          [[ "$PERCH_SPARKLE_FEED_URL" =~ ^https://[^[:space:]]+/appcast\.xml$ ]]
          [[ "$PERCH_DOWNLOAD_MANIFEST_URL" =~ ^https://[^[:space:]]+/latest\.json$ ]]
          [[ "$PERCH_API_BASE_URL$PERCH_DEVICE_GATEWAY_URL$PERCH_SPARKLE_FEED_URL$PERCH_DOWNLOAD_MANIFEST_URL" != *".example"* ]]
          python3 - <<'PY'
          import base64, os
          key = base64.b64decode(os.environ["PERCH_SPARKLE_PUBLIC_KEY"], validate=True)
          if len(key) != 32:
              raise SystemExit("ERROR: PERCH_SPARKLE_PUBLIC_KEY must be a base64 Ed25519 public key (32 bytes)")
          PY
          DERIVED_SPARKLE_PUBLIC_KEY="$(printf '%s' "$SPARKLE_KEY" |
            swift app/scripts/sparkle_public_key.swift)"
          [[ "$DERIVED_SPARKLE_PUBLIC_KEY" == "$PERCH_SPARKLE_PUBLIC_KEY" ]] || {
            echo "ERROR: SPARKLE_ED25519_PRIVATE_KEY does not match PERCH_SPARKLE_PUBLIC_KEY."
            exit 1
          }

      - name: Require a monotonic published build number
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --output "$RUNNER_TEMP/previous-latest.json" \
            --write-out '%{http_code}' "$PERCH_DOWNLOAD_MANIFEST_URL")"
          if [[ "$status" == "200" ]]; then
            PREVIOUS_BUILD="$(python3 -c \
              "import json; print(int(json.load(open('$RUNNER_TEMP/previous-latest.json'))['build']))")"
            (( BUILD_NUMBER > PREVIOUS_BUILD )) || {
              echo "ERROR: build ${BUILD_NUMBER} is not newer than published build ${PREVIOUS_BUILD}."
              exit 1
            }
          elif [[ "$status" != "404" ]]; then
            echo "ERROR: cannot inspect current download pointer (HTTP ${status})."
            exit 1
          fi

      - name: Import Developer ID certificate
        shell: bash
        env:
          CERT_P12_B64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          printf '%s' "$CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          existing_keychains=()
          while IFS= read -r keychain; do
            keychain="${keychain//\"/}"
            [[ -n "$keychain" ]] && existing_keychains+=("$keychain")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" "${existing_keychains[@]}"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
            awk '/Developer ID Application/ {print $2; exit}')"
          [[ -n "$SIGNING_IDENTITY" ]] || {
            echo "ERROR: imported certificate has no Developer ID Application identity."; exit 1;
          }
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Sign and verify executor artifact manifest
        shell: bash
        env:
          EXECUTOR_KEY_B64: ${{ secrets.EXECUTOR_ARTIFACT_SIGNING_KEY_PEM_B64 }}
        run: |
          set -euo pipefail
          cp app/Resources/ExecutorArtifacts.json "$RUNNER_TEMP/ExecutorArtifacts.source.json"
          printf '%s' "$EXECUTOR_KEY_B64" | base64 --decode > "$RUNNER_TEMP/executor-p256.pem"
          chmod 600 "$RUNNER_TEMP/executor-p256.pem"
          python3 app/scripts/executor_manifest.py app/Resources/ExecutorArtifacts.json \
            --sign-key "$RUNNER_TEMP/executor-p256.pem" \
            --output "$RUNNER_TEMP/ExecutorArtifacts.signed.json"
          python3 app/scripts/executor_manifest.py "$RUNNER_TEMP/ExecutorArtifacts.signed.json"
          cp "$RUNNER_TEMP/ExecutorArtifacts.signed.json" app/Resources/ExecutorArtifacts.json

      - name: Generate project and build release app
        shell: bash
        run: |
          set -euo pipefail
          cd app
          xcodegen generate
          DERIVED_DATA="$RUNNER_TEMP/xcode-release"
          xcodebuild -project Perch.xcodeproj -scheme Perch -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            PERCH_API_BASE_URL="$PERCH_API_BASE_URL" \
            PERCH_DEVICE_GATEWAY_URL="$PERCH_DEVICE_GATEWAY_URL" \
            PERCH_SPARKLE_FEED_URL="$PERCH_SPARKLE_FEED_URL" \
            PERCH_SPARKLE_PUBLIC_KEY="$PERCH_SPARKLE_PUBLIC_KEY" \
            PERCH_MARKETING_VERSION="$MARKETING_VERSION" \
            PERCH_BUILD_NUMBER="$BUILD_NUMBER" build
          BUILT_APP="$DERIVED_DATA/Build/Products/Release/Perch.app"
          [[ -d "$BUILT_APP" ]] || { echo "ERROR: Perch.app was not built."; exit 1; }
          echo "BUILT_APP=$BUILT_APP" >> "$GITHUB_ENV"

      - name: Verify embedded manifest before signing
        shell: bash
        run: |
          set -euo pipefail
          EMBEDDED_MANIFEST="$BUILT_APP/Contents/Resources/ExecutorArtifacts.json"
          [[ -f "$EMBEDDED_MANIFEST" ]] || {
            echo "ERROR: signed ExecutorArtifacts.json is not embedded."; exit 1;
          }
          python3 app/scripts/executor_manifest.py "$EMBEDDED_MANIFEST"

      - name: Codesign inside-out with Hardened Runtime
        shell: bash
        run: |
          set -euo pipefail
          APP="$BUILT_APP"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          sign_plain() {
            codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" "$1"
          }
          [[ -d "$SPARKLE/Versions/B" ]] || {
            echo "ERROR: Sparkle 2.9.4 framework layout is not present."; exit 1;
          }
          sign_plain "$SPARKLE/Versions/B/XPCServices/Installer.xpc"
          codesign --force --options runtime --timestamp \
            --preserve-metadata=entitlements --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            "$SPARKLE/Versions/B/XPCServices/Downloader.xpc"
          sign_plain "$SPARKLE/Versions/B/Autoupdate"
          sign_plain "$SPARKLE/Versions/B/Updater.app"
          sign_plain "$SPARKLE"
          EXEC="$APP/Contents/Helpers/PerchExecutor"
          if [[ -f "$EXEC" ]]; then
            codesign --force --options runtime --timestamp \
              --entitlements app/Executor.entitlements --sign "$SIGNING_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" "$EXEC"
          fi
          codesign --force --options runtime --timestamp \
            --entitlements app/Perch.entitlements --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" "$APP"
          codesign --verify --strict "$SPARKLE/Versions/B/XPCServices/Installer.xpc"
          codesign --verify --strict "$SPARKLE/Versions/B/XPCServices/Downloader.xpc"
          codesign --verify --strict "$SPARKLE/Versions/B/Autoupdate"
          codesign --verify --strict "$SPARKLE/Versions/B/Updater.app"
          codesign --verify --strict "$SPARKLE"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Inspect versions, architecture, entitlements, and signatures
        shell: bash
        run: |
          set -euo pipefail
          PLIST="$BUILT_APP/Contents/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" == "$MARKETING_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" == "$BUILD_NUMBER" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$PLIST")" == "$PERCH_SPARKLE_FEED_URL" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$PLIST")" == "$PERCH_SPARKLE_PUBLIC_KEY" ]]
          [[ "$(plutil -extract SURequireSignedFeed raw -o - "$PLIST")" == "true" ]]
          [[ "$(plutil -extract SUVerifyUpdateBeforeExtraction raw -o - "$PLIST")" == "true" ]]
          [[ "$(lipo -archs "$BUILT_APP/Contents/MacOS/Perch")" == "arm64" ]]
          [[ "$(lipo -archs "$BUILT_APP/Contents/Helpers/PerchExecutor")" == "arm64" ]]
          lipo -verify_arch arm64 \
            "$BUILT_APP/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle"
          lipo -verify_arch arm64 \
            "$BUILT_APP/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          lipo -verify_arch arm64 \
            "$BUILT_APP/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app/Contents/MacOS/Updater"
          codesign -d --entitlements :- "$BUILT_APP" > "$RUNNER_TEMP/perch-entitlements.plist"
          codesign -d --entitlements :- "$BUILT_APP/Contents/Helpers/PerchExecutor" \
            > "$RUNNER_TEMP/executor-entitlements.plist"
          codesign -dvvv "$BUILT_APP"
          codesign --verify --deep --strict "$BUILT_APP"

      - name: Scan release app for verified credentials
        shell: bash
        run: |
          brew install trufflehog
          trufflehog filesystem "$BUILT_APP" --only-verified --fail

      - name: Notarize, staple, and create final archive
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          SUBMISSION="$RUNNER_TEMP/Perch-${RELEASE_TAG}-notary.zip"
          ditto -c -k --keepParent "$BUILT_APP" "$SUBMISSION"
          xcrun notarytool submit "$SUBMISSION" --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json | tee "$RUNNER_TEMP/notarytool-result.json"
          [[ "$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/notarytool-result.json')).get('status',''))")" == "Accepted" ]] || {
            echo "ERROR: Apple notarization was not accepted."; exit 1;
          }
          xcrun stapler staple "$BUILT_APP"
          xcrun stapler validate "$BUILT_APP"
          spctl --assess --type execute -vv "$BUILT_APP"
          codesign --verify --deep --strict "$BUILT_APP"
          FINAL_ARCHIVE="$RUNNER_TEMP/Perch-${RELEASE_TAG}.zip"
          ditto -c -k --keepParent "$BUILT_APP" "$FINAL_ARCHIVE"
          echo "FINAL_ARCHIVE=$FINAL_ARCHIVE" >> "$GITHUB_ENV"

      - name: Install official release tools
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix app/release-tools
          npm test --prefix app/release-tools
          curl -fsSL \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.4/Sparkle-2.9.4.tar.xz" \
            -o "$RUNNER_TEMP/Sparkle-2.9.4.tar.xz"
          mkdir "$RUNNER_TEMP/Sparkle-2.9.4"
          tar -xJf "$RUNNER_TEMP/Sparkle-2.9.4.tar.xz" \
            -C "$RUNNER_TEMP/Sparkle-2.9.4"
          echo "SPARKLE_BIN=$RUNNER_TEMP/Sparkle-2.9.4/bin" >> "$GITHUB_ENV"

      - name: Sign and verify Sparkle archive
        shell: bash
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SIGN_OUTPUT="$(printf '%s' "$SPARKLE_KEY" |
            "$SPARKLE_BIN/sign_update" --ed-key-file - "$FINAL_ARCHIVE")"
          SPARKLE_SIGNATURE="$(printf '%s' "$SIGN_OUTPUT" |
            perl -ne 'print $1 if /sparkle:edSignature="([^"]+)"/')"
          [[ -n "$SPARKLE_SIGNATURE" ]] || {
            echo "ERROR: Sparkle sign_update did not return an Ed25519 signature."; exit 1;
          }
          printf '%s' "$SPARKLE_KEY" | "$SPARKLE_BIN/sign_update" \
            --verify --ed-key-file - "$FINAL_ARCHIVE" "$SPARKLE_SIGNATURE"

      - name: Publish digest-addressed archive
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.VERCEL_BLOB_TOKEN }}
        run: |
          set -euo pipefail
          ARTIFACT_SHA256="$(shasum -a 256 "$FINAL_ARCHIVE" | awk '{print $1}')"
          DIGEST_NAME="Perch-${RELEASE_TAG}-${ARTIFACT_SHA256}.zip"
          mv "$FINAL_ARCHIVE" "$RUNNER_TEMP/$DIGEST_NAME"
          FINAL_ARCHIVE="$RUNNER_TEMP/$DIGEST_NAME"
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$DIGEST_NAME" \
            > "$RUNNER_TEMP/${DIGEST_NAME}.sha256"
          ARTIFACT_PATH="releases/sha256/${ARTIFACT_SHA256}/${DIGEST_NAME}"
          ARTIFACT_URL="$(node app/release-tools/blob-put.mjs "$FINAL_ARCHIVE" \
            "$ARTIFACT_PATH" application/zip 31536000 false)"
          CHECKSUM_URL="$(node app/release-tools/blob-put.mjs \
            "$RUNNER_TEMP/${DIGEST_NAME}.sha256" "${ARTIFACT_PATH}.sha256" \
            text/plain 31536000 false)"
          {
            echo "FINAL_ARCHIVE=$FINAL_ARCHIVE"
            echo "DIGEST_NAME=$DIGEST_NAME"
            echo "ARTIFACT_SHA256=$ARTIFACT_SHA256"
            echo "ARTIFACT_URL=$ARTIFACT_URL"
            echo "CHECKSUM_URL=$CHECKSUM_URL"
          } >> "$GITHUB_ENV"

      - name: Generate and verify signed stable appcast
        shell: bash
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          UPDATES_DIR="$RUNNER_TEMP/updates"
          mkdir "$UPDATES_DIR"
          cp "$FINAL_ARCHIVE" "$UPDATES_DIR/$DIGEST_NAME"
          DOWNLOAD_PREFIX="${ARTIFACT_URL%/*}/"
          printf '%s' "$SPARKLE_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - --download-url-prefix "$DOWNLOAD_PREFIX" \
            --versions "$BUILD_NUMBER" --maximum-deltas 0 \
            -o "$UPDATES_DIR/appcast.xml" "$UPDATES_DIR"
          grep -F "$ARTIFACT_URL" "$UPDATES_DIR/appcast.xml"
          grep -F "<sparkle:version>$BUILD_NUMBER</sparkle:version>" "$UPDATES_DIR/appcast.xml"
          grep -F "<sparkle:shortVersionString>$MARKETING_VERSION</sparkle:shortVersionString>" \
            "$UPDATES_DIR/appcast.xml"
          grep -F "sparkle-signatures:" "$UPDATES_DIR/appcast.xml"
          grep -F "edSignature:" "$UPDATES_DIR/appcast.xml"
          printf '%s' "$SPARKLE_KEY" | "$SPARKLE_BIN/sign_update" \
            --verify --ed-key-file - "$UPDATES_DIR/appcast.xml"
          echo "APPCAST_FILE=$UPDATES_DIR/appcast.xml" >> "$GITHUB_ENV"

      - name: Atomically replace stable appcast and website pointer
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.VERCEL_BLOB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<PY
          import json
          from pathlib import Path
          Path("$RUNNER_TEMP/latest.json").write_text(json.dumps({
              "version": "$MARKETING_VERSION",
              "build": int("$BUILD_NUMBER"),
              "tag": "$RELEASE_TAG",
              "url": "$ARTIFACT_URL",
              "sha256": "$ARTIFACT_SHA256",
              "appcast_url": "$PERCH_SPARKLE_FEED_URL",
          }, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          APPCAST_URL="$(node app/release-tools/blob-put.mjs "$APPCAST_FILE" \
            updates/appcast.xml application/xml 60 true)"
          DOWNLOAD_MANIFEST_URL="$(node app/release-tools/blob-put.mjs \
            "$RUNNER_TEMP/latest.json" downloads/latest.json application/json 60 true)"
          [[ "$APPCAST_URL" == "$PERCH_SPARKLE_FEED_URL" ]] || {
            echo "ERROR: PERCH_SPARKLE_FEED_URL must equal the stable Blob URL: $APPCAST_URL"; exit 1;
          }
          [[ "$DOWNLOAD_MANIFEST_URL" == "$PERCH_DOWNLOAD_MANIFEST_URL" ]] || {
            echo "ERROR: PERCH_DOWNLOAD_MANIFEST_URL must equal the stable Blob URL: $DOWNLOAD_MANIFEST_URL"; exit 1;
          }
          {
            echo "APPCAST_URL=$APPCAST_URL"
            echo "DOWNLOAD_MANIFEST_URL=$DOWNLOAD_MANIFEST_URL"
          } >> "$GITHUB_ENV"

      - name: Inspect final public endpoints
        shell: bash
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          curl --fail --show-error --location "$ARTIFACT_URL" \
            --output "$RUNNER_TEMP/published.zip"
          [[ "$(shasum -a 256 "$RUNNER_TEMP/published.zip" | awk '{print $1}')" == "$ARTIFACT_SHA256" ]]
          for attempt in {1..16}; do
            curl --fail --show-error --location "$APPCAST_URL" \
              --output "$RUNNER_TEMP/published-appcast.xml"
            curl --fail --show-error --location "$DOWNLOAD_MANIFEST_URL" \
              --output "$RUNNER_TEMP/published-latest.json"
            if grep -Fq "$ARTIFACT_URL" "$RUNNER_TEMP/published-appcast.xml" &&
              python3 -c "import json; d=json.load(open('$RUNNER_TEMP/published-latest.json')); assert d['sha256'] == '$ARTIFACT_SHA256'"; then
              break
            fi
            (( attempt < 16 )) || {
              echo "ERROR: stable Blob cache did not expose this release within 75 seconds."; exit 1;
            }
            sleep 5
          done
          grep -F "$ARTIFACT_URL" "$RUNNER_TEMP/published-appcast.xml"
          grep -F "sparkle-signatures:" "$RUNNER_TEMP/published-appcast.xml"
          grep -F "edSignature:" "$RUNNER_TEMP/published-appcast.xml"
          printf '%s' "$SPARKLE_KEY" | "$SPARKLE_BIN/sign_update" \
            --verify --ed-key-file - "$RUNNER_TEMP/published-appcast.xml"
          python3 - <<PY
          import json
          data = json.load(open("$RUNNER_TEMP/published-latest.json"))
          assert data["version"] == "$MARKETING_VERSION"
          assert data["build"] == int("$BUILD_NUMBER")
          assert data["url"] == "$ARTIFACT_URL"
          assert data["sha256"] == "$ARTIFACT_SHA256"
          PY
          xcrun stapler validate "$BUILT_APP"
          spctl --assess --type execute -vv "$BUILT_APP"
          codesign --verify --deep --strict "$BUILT_APP"
          python3 app/scripts/executor_manifest.py \
            "$BUILT_APP/Contents/Resources/ExecutorArtifacts.json"

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ env.FINAL_ARCHIVE }}

      - name: Upload audit artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perch-release-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.FINAL_ARCHIVE }}
            ${{ env.APPCAST_FILE }}
            ${{ runner.temp }}/latest.json
            ${{ runner.temp }}/notarytool-result.json
            ${{ runner.temp }}/perch-entitlements.plist
            ${{ runner.temp }}/executor-entitlements.plist
          retention-days: 90

      - name: Release summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Perch ${RELEASE_TAG}
          - Version/build: \`${MARKETING_VERSION} (${BUILD_NUMBER})\`
          - Archive: ${ARTIFACT_URL}
          - SHA-256: \`${ARTIFACT_SHA256}\`
          - Appcast: ${APPCAST_URL}
          - Website pointer: ${DOWNLOAD_MANIFEST_URL}
          - Notarization/Gatekeeper: accepted and verified
          EOF

      - name: Remove release keys and restore source manifest
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/ExecutorArtifacts.source.json" ]]; then
            cp "$RUNNER_TEMP/ExecutorArtifacts.source.json" app/Resources/ExecutorArtifacts.json
          fi
          security delete-keychain "${KEYCHAIN_PATH:-}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/executor-p256.pem"

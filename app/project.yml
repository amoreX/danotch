name: Perch
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  Containerization:
    url: https://github.com/apple/containerization.git
    exactVersion: 0.33.3
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.4
targets:
  Perch:
    type: application
    platform: macOS
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSAppleEventsUsageDescription: Perch accesses Apple Music only to display and control the track you are playing.
        NSHighResolutionCapable: true
        PerchAPIBaseURL: $(PERCH_API_BASE_URL)
        PerchDeviceGatewayURL: $(PERCH_DEVICE_GATEWAY_URL)
        SUFeedURL: $(PERCH_SPARKLE_FEED_URL)
        SUPublicEDKey: $(PERCH_SPARKLE_PUBLIC_KEY)
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        CFBundleURLTypes:
          - CFBundleURLName: engineering.super.Perch.billing
            CFBundleURLSchemes:
              - perch
    sources:
      - path: Sources
        excludes:
          - ExecutorService
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: PerchExecutor
        embed: false
        link: false
      - package: Sparkle
        product: Sparkle
    postCompileScripts:
      - name: Embed verified executor helper
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          cp "${BUILT_PRODUCTS_DIR}/PerchExecutor" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/PerchExecutor"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/PerchExecutor
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/PerchExecutor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.super.Perch
        PRODUCT_NAME: Perch
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Perch.entitlements
        MARKETING_VERSION: $(PERCH_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(PERCH_BUILD_NUMBER)
        PERCH_MARKETING_VERSION: 0.0.0
        PERCH_BUILD_NUMBER: 1
        PERCH_SPARKLE_FEED_URL: ""
        PERCH_SPARKLE_PUBLIC_KEY: ""
  PerchExecutor:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Executor
      - path: Sources/ExecutorService
    postBuildScripts:
      - name: Copy signed executor artifact manifest
        script: |
          cp "${SRCROOT}/Resources/ExecutorArtifacts.json" "${BUILT_PRODUCTS_DIR}/ExecutorArtifacts.json"
        inputFiles:
          - $(SRCROOT)/Resources/ExecutorArtifacts.json
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/ExecutorArtifacts.json
    dependencies:
      - package: Containerization
        product: Containerization
      - package: Containerization
        product: ContainerizationArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.super.Perch.Executor
        PRODUCT_NAME: PerchExecutor
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Executor.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
  PerchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PerchTests
    dependencies:
      - target: Perch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.super.PerchTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
schemes:
  Perch:
    build:
      targets:
        Perch: all
        PerchTests: [test]
    test:
      targets:
        - PerchTests
  PerchExecutor:
    build:
      targets:
        PerchExecutor: all

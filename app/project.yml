name: Perch
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
packages:
  Containerization:
    url: https://github.com/apple/containerization.git
    exactVersion: 0.33.3
targets:
  Perch:
    type: application
    platform: macOS
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSAppleEventsUsageDescription: Perch accesses Apple Music only to display and control the track you are playing.
        NSHighResolutionCapable: true
        PerchDaemonHostRelativePath: Contents/Helpers/PerchDaemonHost
        PerchDaemonRuntimeRelativePath: Contents/Resources/DaemonRuntime
        PerchDaemonEntrypointRelativePath: Contents/Resources/Daemon/entry.mjs
        PerchLaunchAgentTemplateResource: engineering.super.Perch.daemon.plist.template
    sources:
      - path: Sources
        excludes:
          - ExecutorService
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: PerchExecutor
        embed: false
        link: false
      - target: PerchDaemonHost
        embed: false
        link: false
    postCompileScripts:
      - name: Embed verified executor helper
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          cp "${BUILT_PRODUCTS_DIR}/PerchExecutor" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/PerchExecutor"
          cp "${BUILT_PRODUCTS_DIR}/PerchDaemonHost" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/PerchDaemonHost"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/PerchExecutor
          - $(BUILT_PRODUCTS_DIR)/PerchDaemonHost
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/PerchExecutor
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/PerchDaemonHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.super.Perch
        PRODUCT_NAME: Perch
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Perch.entitlements
        MARKETING_VERSION: $(PERCH_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(PERCH_BUILD_NUMBER)
        PERCH_MARKETING_VERSION: 0.0.0
        PERCH_BUILD_NUMBER: 1
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        MACOSX_DEPLOYMENT_TARGET: "26.0"
  PerchDaemonHost:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: DaemonHost
    dependencies:
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.super.Perch.DaemonHost
        PRODUCT_NAME: PerchDaemonHost
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
  PerchExecutor:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Executor
      - path: Sources/ExecutorService
    postBuildScripts:
      - name: Copy signed executor artifact manifest
        script: |
          cp "${SRCROOT}/Resources/ExecutorArtifacts.json" "${BUILT_PRODUCTS_DIR}/ExecutorArtifacts.json"
        inputFiles:
          - $(SRCROOT)/Resources/ExecutorArtifacts.json
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/ExecutorArtifacts.json
    dependencies:
      - package: Containerization
        product: Containerization
      - package: Containerization
        product: ContainerizationArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.super.Perch.Executor
        PRODUCT_NAME: PerchExecutor
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Executor.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
  PerchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PerchTests
    dependencies:
      - target: Perch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.super.PerchTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
schemes:
  Perch:
    build:
      targets:
        Perch: all
        PerchDaemonHost: all
        PerchTests: [test]
    test:
      targets:
        - PerchTests
  PerchExecutor:
    build:
      targets:
        PerchExecutor: all
  PerchDaemonHost:
    build:
      targets:
        PerchDaemonHost: all

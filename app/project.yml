name: Perch
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  Containerization:
    url: https://github.com/apple/containerization.git
    exactVersion: 0.33.3
targets:
  Perch:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - ExecutorService
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: PerchExecutor
        embed: false
        link: false
    postCompileScripts:
      - name: Embed verified executor helper
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          cp "${BUILT_PRODUCTS_DIR}/PerchExecutor" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/PerchExecutor"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/PerchExecutor
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/PerchExecutor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.super.Perch
        PRODUCT_NAME: Perch
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Perch.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Perch accesses Apple Music only to display and control the track you are playing.
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_PerchAPIBaseURL: https://api.perch.example
        INFOPLIST_KEY_PerchDeviceGatewayURL: wss://api.perch.example/api/device-gateway
  PerchExecutor:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Executor
      - path: Sources/ExecutorService
    postBuildScripts:
      - name: Copy signed executor artifact manifest
        script: |
          cp "${SRCROOT}/Resources/ExecutorArtifacts.json" "${BUILT_PRODUCTS_DIR}/ExecutorArtifacts.json"
        inputFiles:
          - $(SRCROOT)/Resources/ExecutorArtifacts.json
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/ExecutorArtifacts.json
    dependencies:
      - package: Containerization
        product: Containerization
      - package: Containerization
        product: ContainerizationArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.super.Perch.Executor
        PRODUCT_NAME: PerchExecutor
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Executor.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
  PerchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PerchTests
    dependencies:
      - target: Perch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.super.PerchTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
schemes:
  Perch:
    build:
      targets:
        Perch: all
        PerchTests: [test]
    test:
      targets:
        - PerchTests
  PerchExecutor:
    build:
      targets:
        PerchExecutor: all
